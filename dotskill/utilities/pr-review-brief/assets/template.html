<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg:          #ffffff;
    --bg-soft:     #f6f8fa;
    --bg-code:     #f6f8fa;
    --text:        #1f2328;
    --text-soft:   #57606a;
    --border:      #d0d7de;
    --accent:      #0969da;
    --accent-soft: #ddf4ff;
    --note:        #0969da;
    --note-bg:     #ddf4ff;
    --tip:         #1a7f37;
    --tip-bg:      #dafbe1;
    --warn:        #9a6700;
    --warn-bg:     #fff8c5;
    --key:         #8250df;
    --key-bg:      #fbefff;
    --tldr-bg:     #f0f6ff;
    --danger:      #cf222e;
    --danger-bg:   #ffebe9;
    --del-bg:      #ffebe9;
    --del-border:  #ff818266;
    --add-bg:      #e6ffec;
    --add-border:  #4ac26b66;
    --max:         900px;
    --sidebar:     270px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
    gap: 48px;
    max-width: calc(var(--max) + var(--sidebar) + 48px);
    margin: 0 auto;
    padding: 40px 28px 96px;
  }

  nav.toc {
    position: sticky;
    top: 28px;
    align-self: start;
    max-height: calc(100vh - 56px);
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.4;
  }
  nav.toc h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    margin: 0 0 12px;
    border: none;
    padding: 0;
  }
  nav.toc ul { list-style: none; margin: 0; padding: 0; }
  nav.toc li { margin: 2px 0; }
  nav.toc a {
    display: block;
    color: var(--text-soft);
    text-decoration: none;
    padding: 3px 10px;
    border-left: 2px solid transparent;
    border-radius: 0 4px 4px 0;
  }
  nav.toc a:hover { color: var(--accent); background: var(--bg-soft); }
  nav.toc a.lvl-3 { padding-left: 24px; font-size: 13px; }
  nav.toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }

  main { min-width: 0; }

  /* ---------- header ---------- */
  header.doc {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  header.doc .meta {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  header.doc h1 {
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  header.doc .subtitle { color: var(--text-soft); font-size: 18px; margin: 0; }
  header.doc .date { color: var(--text-soft); font-size: 13px; margin-top: 10px; }

  /* ---------- typography ---------- */
  h2 {
    font-size: 24px;
    margin: 44px 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 24px;
  }
  h3 { font-size: 19px; margin: 30px 0 10px; scroll-margin-top: 24px; }
  h4 { font-size: 16px; margin: 20px 0 8px; }
  p { margin: 0 0 14px; }
  a { color: var(--accent); }

  .anchor {
    opacity: 0;
    margin-left: 8px;
    color: var(--text-soft);
    text-decoration: none;
    font-weight: 400;
  }
  h2:hover .anchor, h3:hover .anchor { opacity: 1; }

  ul, ol { margin: 0 0 14px; padding-left: 26px; }
  li { margin: 4px 0; }
  li > ul, li > ol { margin: 4px 0; }

  /* ---------- code ---------- */
  code {
    font-family: var(--mono);
    font-size: 0.875em;
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.1em 0.4em;
  }
  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  pre code { background: none; border: none; padding: 0; font-size: 0.85em; }
  pre code.hljs { padding: 0; background: transparent; }

  /* ---------- tables ---------- */
  table { border-collapse: collapse; width: 100%; margin: 0 0 18px; font-size: 15px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--bg-soft); font-weight: 600; }
  tr:nth-child(even) td { background: var(--bg-soft); }

  /* ---------- callouts ---------- */
  .callout {
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 6px;
    padding: 12px 16px;
    margin: 0 0 18px;
    background: var(--bg-soft);
  }
  .callout p:last-child { margin-bottom: 0; }
  .callout::before {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .callout.tldr    { background: var(--tldr-bg); border-left-color: var(--accent); }
  .callout.tldr::before    { content: "Reviewer takeaway"; color: var(--accent); }
  .callout.note    { background: var(--note-bg); border-left-color: var(--note); }
  .callout.note::before    { content: "Note";  color: var(--note); }
  .callout.tip     { background: var(--tip-bg); border-left-color: var(--tip); }
  .callout.tip::before     { content: "Tip";   color: var(--tip); }
  .callout.warning { background: var(--warn-bg); border-left-color: var(--warn); }
  .callout.warning::before { content: "Watch out"; color: var(--warn); }
  .callout.key     { background: var(--key-bg); border-left-color: var(--key); }
  .callout.key::before     { content: "Key point"; color: var(--key); }
  .callout.question { background: var(--bg-soft); border-left-color: var(--text-soft); }
  .callout.question::before { content: "Question for reviewer"; color: var(--text-soft); }

  /* ---------- badges ---------- */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    vertical-align: middle;
    white-space: nowrap;
  }
  .badge.risk-low,  .badge.sev-suggestion, .badge.conf-high   { background: var(--tip-bg);  color: var(--tip);    border-color: var(--tip); }
  .badge.risk-medium,.badge.sev-important, .badge.conf-medium { background: var(--warn-bg); color: var(--warn);   border-color: var(--warn); }
  .badge.risk-high, .badge.sev-blocking,   .badge.conf-low    { background: var(--danger-bg);color: var(--danger); border-color: var(--danger); }
  .badge.prio-start  { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  .badge.prio-after  { background: var(--warn-bg);   color: var(--warn);   border-color: var(--warn); }
  .badge.prio-low    { background: var(--bg-soft);   color: var(--text-soft); border-color: var(--border); }
  .badge.cat         { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---------- finding cards ---------- */
  .finding {
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 8px;
    padding: 14px 18px;
    margin: 0 0 18px;
  }
  .finding.blocking   { border-left-color: var(--danger); }
  .finding.important  { border-left-color: var(--warn); }
  .finding.suggestion { border-left-color: var(--text-soft); }
  .finding h4 { margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .finding h4 .title-text { margin-right: auto; }
  .finding dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .finding dt { font-weight: 600; color: var(--text-soft); font-size: 13px; }
  .finding dd { margin: 0; }

  /* ---------- before / after panels ---------- */
  .change { border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin: 0 0 20px; }
  .change > h3, .change > h4 { margin-top: 0; }
  .ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 12px; }
  .ba-grid > div { min-width: 0; }
  .ba-grid h5 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    margin: 0 0 6px; color: var(--text-soft);
  }
  .ba-grid .before pre { background: var(--del-bg); border-color: var(--del-border); }
  .ba-grid .after  pre { background: var(--add-bg); border-color: var(--add-border); }
  @media (max-width: 760px) { .ba-grid { grid-template-columns: 1fr; } }

  /* ---------- collapsible ---------- */
  details {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 16px;
    margin: 0 0 16px;
    background: var(--bg-soft);
  }
  details[open] { padding-bottom: 8px; }
  summary {
    cursor: pointer;
    font-weight: 600;
    padding: 12px 0;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B6"; font-size: 11px; margin-right: 8px; color: var(--text-soft); }
  details[open] summary::before { content: "\25BC"; }

  /* ---------- mermaid ---------- */
  pre.mermaid {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    overflow-x: auto;
  }

  blockquote { margin: 0 0 16px; padding: 4px 16px; border-left: 4px solid var(--border); color: var(--text-soft); }
  hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; gap: 0; padding-top: 28px; }
    nav.toc {
      position: static; max-height: none; margin-bottom: 32px;
      padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
  }

  /* ---------- print ---------- */
  @media print {
    nav.toc { display: none; }
    .layout { display: block; max-width: 100%; padding: 0; }
    a { color: var(--text); }
    .anchor { display: none; }
    details { border: none; padding: 0; }
    details > summary { display: none; }
    details[open], details:not([open]) { }
    details > *:not(summary) { display: revert !important; }
    pre, table, .callout, pre.mermaid, .finding, .change { break-inside: avoid; }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Table of contents">
    <h2>On this page</h2>
    <ul id="toc-list"></ul>
  </nav>

  <main>
    <header class="doc">
      <span class="meta">{{PURPOSE}}</span>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <p class="date">{{DATE}}</p>
    </header>

    <article id="content">
{{BODY}}
    </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: true, theme: "default", securityLevel: "loose" });

  if (window.hljs) {
    document.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
  }

  (function () {
    const content = document.getElementById("content");
    const list = document.getElementById("toc-list");
    const headings = content.querySelectorAll("h2, h3");
    const used = new Set();

    const slug = (t) => {
      let s = t.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
      let base = s || "section", i = 1;
      while (used.has(s)) { s = base + "-" + (++i); }
      used.add(s);
      return s;
    };

    headings.forEach((h) => {
      const id = h.id || slug(h.textContent);
      h.id = id;

      const a = document.createElement("a");
      a.href = "#" + id;
      a.className = "anchor";
      a.textContent = "#";
      a.setAttribute("aria-label", "Link to this section");
      h.appendChild(a);

      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = "#" + id;
      link.textContent = h.firstChild.textContent || h.textContent.replace(/#$/, "");
      link.className = h.tagName === "H3" ? "lvl-3" : "lvl-2";
      li.appendChild(link);
      list.appendChild(li);
    });

    if (!headings.length) {
      document.querySelector("nav.toc").style.display = "none";
    }

    const tocLinks = Array.from(list.querySelectorAll("a"));
    const byId = new Map(tocLinks.map((l) => [l.getAttribute("href").slice(1), l]));
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          tocLinks.forEach((l) => l.classList.remove("active"));
          const link = byId.get(e.target.id);
          if (link) link.classList.add("active");
        }
      });
    }, { rootMargin: "0px 0px -75% 0px" });
    headings.forEach((h) => observer.observe(h));
  })();
</script>
</body>
</html>

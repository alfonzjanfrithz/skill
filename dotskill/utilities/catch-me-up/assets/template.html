<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg:        #ffffff;
    --bg-soft:   #f6f8fa;
    --text:      #1f2328;
    --text-soft: #57606a;
    --border:    #d0d7de;
    --accent:    #0969da;
    --accent-bg: #ddf4ff;
    --warn:      #9a6700;
    --warn-bg:   #fff8c5;
    --max:       880px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: var(--max); margin: 0 auto; padding: 40px 28px 96px; }
  header.brief {
    border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 32px;
  }
  header.brief .mode {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-bg); border-radius: 999px; padding: 3px 12px; margin-bottom: 12px;
  }
  header.brief h1 { font-size: 28px; margin: 0 0 6px; }
  header.brief .subtitle { color: var(--text-soft); margin: 0; }
  header.brief .date { color: var(--text-soft); font-size: 13px; margin: 8px 0 0; }
  h2 { font-size: 21px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 17px; margin-top: 28px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: var(--mono); font-size: .88em;
    background: var(--bg-soft); border-radius: 6px; padding: .15em .4em;
  }
  pre {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: .85em; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: .92em; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--bg-soft); }
  blockquote {
    margin: 16px 0; padding: 10px 16px; border-left: 4px solid var(--warn);
    background: var(--warn-bg); color: var(--warn); border-radius: 0 6px 6px 0;
  }
  /* ---------- mermaid ---------- */
  pre.mermaid {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; text-align: center; overflow-x: auto;
  }
  @media print {
    pre, table, pre.mermaid, blockquote { break-inside: avoid; }
    a { color: var(--text); }
  }
</style>
</head>
<body>
<main>
  <header class="brief">
    <span class="mode">{{MODE}}</span>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <p class="date">{{DATE}}</p>
  </header>
{{BODY}}
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  // Light-theme Mermaid. Diagrams are emitted as <pre class="mermaid">…</pre>.
  mermaid.initialize({ startOnLoad: true, theme: "default", securityLevel: "loose" });
</script>
</body>
</html>

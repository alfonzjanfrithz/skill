# CompositeResourceDefinition (XRD) — Crossplane v2
# metadata.name MUST be <plural>.<group>
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xdatabases.platform.acme.io
spec:
  group: platform.acme.io
  names:
    kind: XDatabase
    plural: xdatabases
  scope: Namespaced          # Namespaced (default) | Cluster | LegacyCluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true    # exactly one version true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                size:
                  type: string
                  enum: [small, medium, large]
              required:
                - region
                - size
            status:
              type: object
              properties:
                address:
                  type: string
